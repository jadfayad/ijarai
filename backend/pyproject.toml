[project]
name = "optim-house-backend"
version = "0.1.0"
description = "Apartment location scoring API for Dubai"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "pydantic>=2.9.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "geojson>=3.1.0",
    "global-land-mask>=1.0.0",
    "cachetools>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
